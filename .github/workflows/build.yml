name: Build Rulesets

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 4 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Download latest mihomo binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import gzip
          import json
          import os
          import shutil
          import urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "slimrules-ci/1.0",
          }
          token = os.environ.get("GH_TOKEN")
          if token:
              headers["Authorization"] = f"Bearer {token}"

          req = urllib.request.Request(
              "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest",
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              release = json.loads(resp.read().decode("utf-8"))

          tag = release["tag_name"]
          assets = {a["name"]: a["browser_download_url"] for a in release.get("assets", [])}
          candidates = [
              f"mihomo-linux-amd64-{tag}.gz",
              f"mihomo-linux-amd64-compatible-{tag}.gz",
          ]
          url = next((assets[c] for c in candidates if c in assets), None)
          if not url:
              raise SystemExit(f"Could not find linux-amd64 mihomo binary for {tag}")

          print(f"Downloading {url}")
          dl_req = urllib.request.Request(url, headers={"User-Agent": "slimrules-ci/1.0"})
          with urllib.request.urlopen(dl_req, timeout=60) as r, open("mihomo.gz", "wb") as f:
              shutil.copyfileobj(r, f)

          with gzip.open("mihomo.gz", "rb") as gz, open("mihomo", "wb") as out:
              shutil.copyfileobj(gz, out)
          os.remove("mihomo.gz")
          EOF
          chmod +x ./mihomo
          ./mihomo -v

      - name: Build Surge and Mihomo rulesets
        run: python3 scripts/build.py --output dist --mihomo-bin ./mihomo

      - name: Sanity-check generated rulesets
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path

          dist = Path("dist")
          manifest = json.loads((dist / "manifest.json").read_text(encoding="utf-8"))
          expected = {
              "private",
              "apple_cdn",
              "google",
              "ai",
              "cn",
              "proxy",
              "private_ip",
              "telegram_ip",
              "ai_ip",
              "cn_ip",
          }
          actual = set(manifest["rulesets"].keys())
          assert expected == actual, f"Mismatch: {expected ^ actual}"

          for name, info in manifest["rulesets"].items():
              assert info["count"] > 0, f"{name} is empty"
              for key in ("surge", "mihomo_text", "mihomo_mrs"):
                  p = dist / info[key]
                  assert p.is_file() and p.stat().st_size > 0, f"Missing or empty: {p}"

          blocked_suffixes = ("google.com", "googleapis.com", "deepmind.com", "google")
          ai_lines = (dist / "mihomo/domain/ai.txt").read_text(encoding="utf-8").splitlines()
          leaks = [
              line for line in ai_lines
              if any(
                  line.lstrip("+.").rstrip(".") == s or line.lstrip("+.").endswith("." + s)
                  for s in blocked_suffixes
              )
          ]
          assert not leaks, f"Found Google domains in ai.txt: {leaks}"
          print("All 10 rulesets (.list, .txt, .mrs) verified successfully.")
          EOF

      - name: Publish to release branch
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          WORKDIR="$(mktemp -d)"

          if git ls-remote --exit-code --heads "$REPO_URL" release >/dev/null 2>&1; then
            git clone --depth 1 --branch release "$REPO_URL" "$WORKDIR"
          else
            git clone --depth 1 "$REPO_URL" "$WORKDIR"
            git -C "$WORKDIR" checkout --orphan release
            git -C "$WORKDIR" rm -rf . >/dev/null 2>&1 || true
          fi

          find "$WORKDIR" -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -r dist/* "$WORKDIR"/

          git -C "$WORKDIR" config user.name "github-actions[bot]"
          git -C "$WORKDIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$WORKDIR" add --all

          if git -C "$WORKDIR" diff --cached --quiet; then
            echo "No changes detected, skipping push"
            exit 0
          fi

          git -C "$WORKDIR" commit -m "chore(release): update rulesets"
          git -C "$WORKDIR" push origin release
